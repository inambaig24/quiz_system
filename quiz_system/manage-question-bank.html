<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Question Bank - Admin Console</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-800 fs-22" href="admin-dashboard.html">
                <i class="bi bi-shield-fill text-dark me-2"></i><span>Admin</span>System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="admin-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="manage-users.html">Manage Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="manage-subjects.html">Manage Subjects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-600 px-3 py-2 rounded" href="manage-question-bank.html">Question Bank</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-info">
                        <div class="user-avatar text-uppercase fw-800" style="background-color: var(--dark-navy); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center;">A</div>
                        <span class="user-name fw-700">Admin</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-5">
            <div>
                <h1 class="fw-800 text-dark mb-1">Global Question Bank Management</h1>
                <p class="text-muted mb-0">Contribute standalone questions for practice quiz generation and subject testing.</p>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Left Column: Add Question Form -->
            <div class="col-lg-5">
                <div class="card p-4 bg-white border rounded-4 shadow-sm">
                    <h4 class="fw-700 text-dark mb-4">Add Question to Bank</h4>
                    
                    <form id="add-bank-question-form" novalidate>
                        <!-- Select Subject -->
                        <div class="mb-3">
                            <label for="bank-subject-select" class="form-label">Subject</label>
                            <select class="form-select" id="bank-subject-select" required>
                                <option value="" selected disabled>Loading subjects...</option>
                            </select>
                        </div>

                        <!-- Difficulty -->
                        <div class="mb-3">
                            <label for="bank-q-difficulty" class="form-label">Difficulty Level</label>
                            <select class="form-select" id="bank-q-difficulty" required>
                                <option value="Easy" selected>Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>

                        <!-- Question Text -->
                        <div class="mb-3">
                            <label for="bank-q-text" class="form-label">Question Text</label>
                            <textarea class="form-control" id="bank-q-text" rows="3" placeholder="Enter question description..." required></textarea>
                        </div>

                        <!-- Option A & B -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="bank-q-opt-a" class="form-label">Option A</label>
                                <input type="text" class="form-control" id="bank-q-opt-a" placeholder="Option A" required>
                            </div>
                            <div class="col-md-6">
                                <label for="bank-q-opt-b" class="form-label">Option B</label>
                                <input type="text" class="form-control" id="bank-q-opt-b" placeholder="Option B" required>
                            </div>
                        </div>

                        <!-- Option C & D -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="bank-q-opt-c" class="form-label">Option C</label>
                                <input type="text" class="form-control" id="bank-q-opt-c" placeholder="Option C" required>
                            </div>
                            <div class="col-md-6">
                                <label for="bank-q-opt-d" class="form-label">Option D</label>
                                <input type="text" class="form-control" id="bank-q-opt-d" placeholder="Option D" required>
                            </div>
                        </div>

                        <!-- Correct Option -->
                        <div class="mb-4">
                            <label for="bank-q-correct-opt" class="form-label">Correct Option</label>
                            <select class="form-select" id="bank-q-correct-opt" required>
                                <option value="" selected disabled>Select Correct Option</option>
                                <option value="A">Option A</option>
                                <option value="B">Option B</option>
                                <option value="C">Option C</option>
                                <option value="D">Option D</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary fw-600 btn-block py-2">
                            <i class="bi bi-plus-lg me-1"></i> Add Question to Bank
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Filter and View Global Bank Questions -->
            <div class="col-lg-7">
                <div class="card p-4 bg-white border rounded-4 shadow-sm">
                    <h4 class="fw-700 text-dark mb-4">Question Bank Directory</h4>

                    <!-- Filters -->
                    <div class="row g-2 mb-4">
                        <!-- Subject Filter -->
                        <div class="col-md-4">
                            <select class="form-select btn-sm py-2" id="filter-bank-subject">
                                <option value="all" selected>All Subjects</option>
                            </select>
                        </div>
                        
                        <!-- Difficulty Filter -->
                        <div class="col-md-4">
                            <select class="form-select btn-sm py-2" id="filter-bank-difficulty">
                                <option value="all" selected>All Difficulties</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>

                        <!-- Search bar -->
                        <div class="col-md-4">
                            <div class="search-bar max-width-100" style="max-width: 100%;">
                                <i class="bi bi-search search-icon"></i>
                                <input type="text" id="search-bank" class="form-control btn-sm py-2" placeholder="Search questions...">
                            </div>
                        </div>
                    </div>

                    <!-- Questions list container -->
                    <div id="bank-questions-list" style="max-height: 550px; overflow-y: auto; padding-right: 5px;">
                        <div class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Loading bank...
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>
    <script src="frontend/assets/js/admin.js"></script>
</body>
</html>

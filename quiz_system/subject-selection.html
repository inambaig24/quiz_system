<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subject - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-800 fs-22" href="student-dashboard.html">
                <i class="bi bi-mortarboard-fill text-success me-2"></i><span>Quiz</span>System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="student-dashboard.html">
                            <i class="bi bi-house-door-fill me-1"></i>Dashboard
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-info">
                        <div class="user-avatar user-name-display text-uppercase" style="width: 36px; height: 36px; border-radius: 50%; font-weight: 700; display: flex; justify-content: center; align-items: center; background-color: var(--success); color: #fff;">S</div>
                        <span class="user-name fw-700 user-name-display">Student</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5">
        <a href="student-dashboard.html" class="back-link d-inline-flex align-items-center gap-1 mb-4 text-muted text-decoration-none fw-600">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-5">
            <div>
                <h1 class="fw-800 text-dark mb-1">Select Subject</h1>
                <p class="text-muted mb-0">Choose a subject to fetch questions from the global question bank.</p>
            </div>
            
            <!-- Search bar -->
            <div class="search-bar">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="search-subjects" class="form-control" placeholder="Search subjects...">
            </div>
        </div>

        <!-- Subjects Grid List (Pill shapes injected by student.js) -->
        <div class="row g-4 justify-content-center" id="subject-cards-list">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>
    <script src="frontend/assets/js/student.js"></script>
</body>
</html>

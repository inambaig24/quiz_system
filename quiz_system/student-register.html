<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="student-login.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>
            <h2 class="auth-title">Student Registration</h2>
            <p class="auth-subtitle">Create your student account using your university ID email</p>

            <form id="student-register-form" novalidate>
                <!-- Full Name Input -->
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label">University Student Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="IUXX-XXXX-XXXX@iqra.edu.pk" required>
                    </div>
                    <small class="text-muted d-block mt-1 fs-12">Must match university ID format, e.g., IU09-0322-9023@iqra.edu.pk</small>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="mb-4">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirm-password" placeholder="Re-enter password" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm-password', this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-success btn-block mb-3">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted fs-15">Already have an account? </span>
                <a href="student-login.html" class="fw-700 text-success text-decoration-none">Log In here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- API and Global Script files -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>

    <!-- Page Specific Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('student-register-form');
            if (form) {
                initLiveValidation(form);
                form.addEventListener('submit', handleRegister);
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm-password');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            let isValid = true;

            // Validate Name
            if (!name) {
                setInputValidity(nameInput, false, 'Full name is required.');
                isValid = false;
            } else {
                setInputValidity(nameInput, true);
            }

            // Validate Email
            if (!email) {
                setInputValidity(emailInput, false, 'Email is required.');
                isValid = false;
            } else if (!validateStudentEmail(email)) {
                setInputValidity(emailInput, false, 'Student email must follow university ID format (e.g. IU09-0322-9023@iqra.edu.pk).');
                isValid = false;
            } else {
                setInputValidity(emailInput, true);
            }

            // Validate Password
            if (!password) {
                setInputValidity(passwordInput, false, 'Password is required.');
                isValid = false;
            } else if (!validatePassword(password)) {
                setInputValidity(passwordInput, false, 'Password must be at least 6 characters.');
                isValid = false;
            } else {
                setInputValidity(passwordInput, true);
            }

            // Validate Confirm Password
            if (!confirm) {
                setInputValidity(confirmInput, false, 'Please confirm your password.');
                isValid = false;
            } else if (password !== confirm) {
                setInputValidity(confirmInput, false, 'Passwords do not match.');
                isValid = false;
            } else {
                setInputValidity(confirmInput, true);
            }

            if (!isValid) return;

            try {
                const response = await apiPost('auth/student-register.php', {
                    name: name,
                    email: email,
                    password: password
                });

                if (response.success) {
                    showToast('Registration successful! Please log in.', 'success');
                    setTimeout(() => {
                        window.location.href = 'student-login.html';
                    }, 1500);
                } else {
                    showToast(response.message, 'danger');
                }
            } catch (err) {
                showToast(err.message, 'danger');
            }
        }
    </script>
</body>
</html>

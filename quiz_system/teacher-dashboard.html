<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
    <!-- Dashboard Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/dashboard.css">
</head>

<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-800 fs-22" href="teacher-dashboard.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i><span>Quiz</span>System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-600 px-3 py-2 rounded" href="teacher-dashboard.html">
                            <i class="bi bi-house-door-fill me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="teacher-reports.html">
                            <i class="bi bi-bar-chart-fill me-1"></i>Reports & Analytics
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-info">
                        <div class="user-avatar user-name-display text-uppercase"
                            style="width: 36px; height: 36px; border-radius: 50%; font-weight: 700; display: flex; justify-content: center; align-items: center; background-color: var(--primary); color: #fff;">
                            T</div>
                        <div>
                            <span class="user-name d-block fw-700 user-name-display">Teacher</span>
                            <small class="text-muted d-block fs-11 user-role-display">Teacher</small>
                        </div>
                    </div>
                    <button class="btn btn-outline-danger btn-sm logout-btn fw-600 px-3">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5">

        <!-- Welcome banner -->
        <div
            class="dashboard-welcome p-5 rounded-4 bg-white border mb-5 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="fw-800 mb-2">Hello, <span class="user-name-display text-primary">Teacher</span>!</h1>
                <p class="text-muted fs-16 mb-0">Create new quizzes or track your students' performance from your
                    centralized cockpit.</p>
            </div>
            <div>
                <a href="create-quiz.html" class="btn btn-primary btn-lg rounded-pill fw-600">
                    <i class="bi bi-plus-lg me-1"></i>Create New Quiz
                </a>
            </div>
        </div>

        <!-- Dashboard Stats Grid -->
        <div class="row g-4 mb-5">
            <!-- Stat 1 -->
            <div class="col-md-4">
                <div class="stat-card border-start border-primary border-4 h-100 bg-white">
                    <div class="stat-icon bg-light text-primary"><i class="bi bi-journal-text"></i></div>
                    <div class="stat-value" id="stat-total-quizzes">0</div>
                    <div class="stat-label">Total Quizzes Created</div>
                </div>
            </div>
            <!-- Stat 2 -->
            <div class="col-md-4">
                <div class="stat-card border-start border-success border-4 h-100 bg-white">
                    <div class="stat-icon bg-light text-success"><i class="bi bi-check2-circle"></i></div>
                    <div class="stat-value" id="stat-active-quizzes">0</div>
                    <div class="stat-label">Active Quizzes</div>
                </div>
            </div>
            <!-- Stat 3 -->
            <div class="col-md-4">
                <div class="stat-card border-start border-warning border-4 h-100 bg-white">
                    <div class="stat-icon bg-light text-warning"><i class="bi bi-people"></i></div>
                    <div class="stat-value" id="stat-total-attempts">0</div>
                    <div class="stat-label">Student Quiz Attempts</div>
                </div>
            </div>
        </div>

        <!-- Quiz List Section -->
        <div class="bg-white border rounded-4 p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <h3 class="fw-800 mb-0">Your Quiz Directory</h3>

                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <!-- Search Input -->
                    <div class="search-bar">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="search-quizzes" class="form-control"
                            placeholder="Search by title, subject, code...">
                    </div>
                </div>
            </div>

            <!-- Tabs Filters -->
            <div class="filter-tabs d-flex gap-2 border-bottom pb-3 mb-4 flex-wrap">
                <button class="tab-item active btn btn-light rounded-pill px-4 btn-sm" data-status="all">All
                    Quizzes</button>
                <button class="tab-item btn btn-light rounded-pill px-4 btn-sm" data-status="active">Active</button>
                <button class="tab-item btn btn-light rounded-pill px-4 btn-sm"
                    data-status="completed">Completed</button>
                <button class="tab-item btn btn-light rounded-pill px-4 btn-sm"
                    data-status="cancelled">Cancelled</button>
            </div>

            <!-- Quiz Grid List -->
            <div class="row g-4" id="teacher-quiz-list">
                <!-- Quizzes will be populated here -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>
    <script src="frontend/assets/js/teacher.js"></script>
</body>

</html>

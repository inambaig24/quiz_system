<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attempt Quiz - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
    <!-- Quiz Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/quiz.css">
</head>
<body>

    <div class="quiz-outer-container py-5">
        <div class="quiz-container">
            
            <!-- Quiz Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3 bg-white p-4 rounded-4 border">
                <div>
                    <span class="badge bg-light text-success border rounded-pill px-3 mb-1 fw-700" id="quiz-subject-display">Subject</span>
                    <h2 class="fw-800 text-dark mb-0" id="quiz-title-display">Quiz Title</h2>
                </div>
                
                <!-- Timer Display Pill -->
                <div class="timer-card d-flex align-items-center gap-2 px-4 py-2 border rounded-pill" id="timer-card-wrapper" style="animation: timerPulse 2s infinite;">
                    <i class="bi bi-clock-fill fs-5"></i>
                    <span class="fw-800 fs-18 font-monospace" id="quiz-timer-display">00:00</span>
                </div>
            </div>

            <!-- Quiz Progress bar -->
            <div class="progress mb-4" style="height: 10px; border-radius: 5px;">
                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" id="quiz-progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <!-- Quiz Main Box -->
            <div class="card p-4 p-md-5 bg-white border rounded-4 shadow-sm mb-4">
                <!-- Question Number -->
                <div class="fs-15 text-muted fw-700 mb-3 text-uppercase">
                    Question <span id="current-question-num" class="text-success">0</span> of <span id="total-questions-num">0</span>
                </div>
                
                <!-- Question statement text -->
                <h3 class="question-text fw-700 text-dark mb-4" id="question-text-display">Loading question...</h3>

                <!-- MCQ Options (Injected by quiz.js) -->
                <div class="row" id="options-container">
                    <!-- Option items will be rendered dynamically -->
                </div>
            </div>

            <!-- Bottom Control Panel: Buttons & Progress Dots -->
            <div class="card p-4 bg-white border rounded-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <button class="btn btn-outline-secondary px-4 fw-600" id="prev-question-btn" disabled>
                        <i class="bi bi-arrow-left me-1"></i> Previous
                    </button>
                    
                    <button class="btn btn-primary px-4 fw-600" id="next-question-btn">
                        Next <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                    
                    <button class="btn btn-success px-5 fw-700" id="submit-quiz-btn" style="display: none;">
                        Submit Quiz <i class="bi bi-check-circle-fill ms-1"></i>
                    </button>
                </div>

                <!-- Horizontal scrollable list of question shortcut buttons (Dots) -->
                <div class="border-top pt-3 text-center">
                    <div class="fs-13 fw-600 text-muted mb-2">Navigate Questions:</div>
                    <div class="d-flex gap-2 justify-content-center flex-wrap" id="progress-dots-container">
                        <!-- Progress dots numbers will be dynamically created -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>
    <script src="frontend/assets/js/quiz.js"></script>
</body>
</html>

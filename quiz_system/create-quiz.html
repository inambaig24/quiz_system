<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand fw-800 fs-22" href="teacher-dashboard.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i><span>Quiz</span>System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="teacher-dashboard.html">
                            <i class="bi bi-house-door-fill me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-600 px-3 py-2 rounded" href="teacher-reports.html">
                            <i class="bi bi-bar-chart-fill me-1"></i>Reports & Analytics
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="user-info">
                        <div class="user-avatar user-name-display text-uppercase" style="width: 36px; height: 36px; border-radius: 50%; font-weight: 700; display: flex; justify-content: center; align-items: center; background-color: var(--primary); color: #fff;">T</div>
                        <span class="user-name fw-700 user-name-display">Teacher</span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm logout-btn fw-600 px-3">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5" style="max-width: 800px;">
        <a href="teacher-dashboard.html" class="back-link d-inline-flex align-items-center gap-1 mb-4 text-muted text-decoration-none fw-600">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card p-4 p-md-5 bg-white border rounded-4 shadow-sm">
            <h2 class="fw-800 text-dark mb-2">Create New Assessment</h2>
            <p class="text-muted mb-4">Set up quiz parameters. You will define the questions in the next step.</p>

            <form id="create-quiz-form" novalidate>
                <div class="row">
                    <!-- Subject Selection -->
                    <div class="col-md-6 mb-3">
                        <label for="quiz-subject" class="form-label">Subject</label>
                        <select class="form-select" id="quiz-subject" required>
                            <option value="" selected disabled>Loading subjects...</option>
                        </select>
                    </div>

                    <!-- Difficulty Selection -->
                    <div class="col-md-6 mb-3">
                        <label for="quiz-difficulty" class="form-label">Difficulty Level</label>
                        <select class="form-select" id="quiz-difficulty" required>
                            <option value="Easy" selected>Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>

                    <!-- Title -->
                    <div class="col-12 mb-3">
                        <label for="quiz-title" class="form-label">Quiz Title</label>
                        <input type="text" class="form-control" id="quiz-title" placeholder="e.g. Midterm 1: Relational Algebra" required>
                    </div>

                    <!-- Description -->
                    <div class="col-12 mb-3">
                        <label for="quiz-description" class="form-label">Description / Instructions (Optional)</label>
                        <textarea class="form-control" id="quiz-description" placeholder="e.g. This test consists of multiple choice questions. No calculators allowed." rows="3"></textarea>
                    </div>

                    <!-- Timer (Duration) -->
                    <div class="col-md-6 mb-3">
                        <label for="quiz-duration" class="form-label">Duration (Minutes)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-clock"></i></span>
                            <input type="number" class="form-control" id="quiz-duration" min="1" max="180" placeholder="e.g. 30" required>
                        </div>
                        <small class="text-muted d-block mt-1 fs-12">Min: 1 min, Max: 180 mins</small>
                    </div>

                    <!-- Total Questions -->
                    <div class="col-md-6 mb-4">
                        <label for="quiz-questions" class="form-label">Total Questions to Add</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-question-circle"></i></span>
                            <input type="number" class="form-control" id="quiz-questions" min="1" max="100" placeholder="e.g. 10" required>
                        </div>
                        <small class="text-muted d-block mt-1 fs-12">Number of questions you will write (1 to 100)</small>
                    </div>

                    <!-- Color Theme Selection -->
                    <div class="col-12 mb-4">
                        <label class="form-label d-block mb-3">Quiz Card Theme Accent</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <!-- Blue Theme -->
                            <input type="radio" class="btn-check" name="quiz-theme" id="theme-blue" value="blue" checked autocomplete="off">
                            <label class="btn btn-outline-primary border-2 px-3 py-2 rounded-pill fw-600" for="theme-blue">
                                <span class="d-inline-block rounded-circle me-1" style="width: 12px; height: 12px; background-color: #0D6EFD;"></span> Blue
                            </label>

                            <!-- Green Theme -->
                            <input type="radio" class="btn-check" name="quiz-theme" id="theme-green" value="green" autocomplete="off">
                            <label class="btn btn-outline-success border-2 px-3 py-2 rounded-pill fw-600" for="theme-green">
                                <span class="d-inline-block rounded-circle me-1" style="width: 12px; height: 12px; background-color: #198754;"></span> Green
                            </label>

                            <!-- Purple Theme -->
                            <input type="radio" class="btn-check" name="quiz-theme" id="theme-purple" value="purple" autocomplete="off">
                            <label class="btn btn-outline-dark border-2 px-3 py-2 rounded-pill fw-600" for="theme-purple" style="border-color: #6F42C1; color: #6F42C1;">
                                <span class="d-inline-block rounded-circle me-1" style="width: 12px; height: 12px; background-color: #6F42C1;"></span> Purple
                            </label>

                            <!-- Yellow/Gold Theme -->
                            <input type="radio" class="btn-check" name="quiz-theme" id="theme-yellow" value="yellow" autocomplete="off">
                            <label class="btn btn-outline-warning border-2 px-3 py-2 rounded-pill fw-600" for="theme-yellow">
                                <span class="d-inline-block rounded-circle me-1" style="width: 12px; height: 12px; background-color: #FFC107;"></span> Yellow
                            </label>
                            
                            <!-- Red/Orange Theme -->
                            <input type="radio" class="btn-check" name="quiz-theme" id="theme-orange" value="orange" autocomplete="off">
                            <label class="btn btn-outline-danger border-2 px-3 py-2 rounded-pill fw-600" for="theme-orange">
                                <span class="d-inline-block rounded-circle me-1" style="width: 12px; height: 12px; background-color: #FD7E14;"></span> Orange
                            </label>
                        </div>
                    </div>
                </div>

                <div class="border-top pt-4 mt-2 d-flex justify-content-between align-items-center gap-3 flex-wrap">
                    <a href="teacher-dashboard.html" class="btn btn-outline-secondary px-4 fw-600">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-600">
                        Proceed to Add Questions <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>
    <script src="frontend/assets/js/teacher.js"></script>
</body>
</html>

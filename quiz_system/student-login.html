<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
            <h2 class="auth-title">Student Login</h2>
            <p class="auth-subtitle">Enter your university ID credentials to join quizzes</p>

            <form id="student-login-form" novalidate>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label">University Student Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="IUXX-XXXX-XXXX@iqra.edu.pk" required>
                    </div>
                    <small class="text-muted d-block mt-1 fs-12">Format: IUXX-XXXX-XXXX@iqra.edu.pk (e.g., IU09-0322-9023@iqra.edu.pk)</small>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-success btn-block mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Log In
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted fs-15">Don't have an account? </span>
                <a href="student-register.html" class="fw-700 text-success text-decoration-none">Register here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- API and Global Script files -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>

    <!-- Page Specific Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('student-login-form');
            if (form) {
                initLiveValidation(form);
                form.addEventListener('submit', handleLogin);
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let isValid = true;

            // Validate email
            if (!email) {
                setInputValidity(emailInput, false, 'Email is required.');
                isValid = false;
            } else if (!validateStudentEmail(email)) {
                setInputValidity(emailInput, false, 'Student email must follow university ID format (e.g. IU09-0322-9023@iqra.edu.pk).');
                isValid = false;
            } else {
                setInputValidity(emailInput, true);
            }

            // Validate password
            if (!password) {
                setInputValidity(passwordInput, false, 'Password is required.');
                isValid = false;
            } else {
                setInputValidity(passwordInput, true);
            }

            if (!isValid) return;

            try {
                const response = await apiPost('auth/student-login.php', {
                    email: email,
                    password: password
                });

                if (response.success) {
                    showToast('Login successful! Redirecting...', 'success');
                    
                    // Cache user details
                    localStorage.setItem('user', JSON.stringify({
                        id: response.data.student_id,
                        name: response.data.name,
                        email: response.data.email,
                        role: 'student'
                    }));

                    setTimeout(() => {
                        window.location.href = 'student-dashboard.html';
                    }, 1000);
                } else {
                    showToast(response.message, 'danger');
                }
            } catch (err) {
                showToast(err.message, 'danger');
            }
        }
    </script>
</body>
</html>

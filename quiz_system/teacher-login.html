<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Online Quiz System</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="frontend/assets/css/style.css">
</head>

<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
            <h2 class="auth-title">Teacher Login</h2>
            <p class="auth-subtitle">Log in to manage your quizzes and student analytics</p>

            <form id="teacher-login-form" novalidate>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label">University Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="name@iqra.edu.pk" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button"
                            onclick="togglePasswordVisibility('password', this)"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Log In
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted fs-15">Don't have an account? </span>
                <a href="teacher-register.html" class="fw-700 text-primary text-decoration-none">Register here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API and Global Script files -->
    <script src="frontend/assets/js/api.js"></script>
    <script src="frontend/assets/js/validation.js"></script>
    <script src="frontend/assets/js/main.js"></script>

    <!-- Page Specific Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('teacher-login-form');
            if (form) {
                initLiveValidation(form);
                form.addEventListener('submit', handleLogin);
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let isValid = true;

            // Validate email
            if (!email) {
                setInputValidity(emailInput, false, 'Email is required.');
                isValid = false;
            } else if (!validateTeacherEmail(email)) {
                setInputValidity(emailInput, false, 'Teacher email must follow format: user@iqra.edu.pk');
                isValid = false;
            } else {
                setInputValidity(emailInput, true);
            }

            // Validate password
            if (!password) {
                setInputValidity(passwordInput, false, 'Password is required.');
                isValid = false;
            } else {
                setInputValidity(passwordInput, true);
            }

            if (!isValid) return;

            try {
                const response = await apiPost('auth/teacher-login.php', {
                    email: email,
                    password: password
                });

                if (response.success) {
                    showToast('Login successful! Redirecting...', 'success');

                    // Cache user profile details
                    localStorage.setItem('user', JSON.stringify({
                        id: response.data.student_id || response.data.teacher_id,
                        name: response.data.name,
                        email: response.data.email,
                        role: 'teacher'
                    }));

                    setTimeout(() => {
                        window.location.href = 'teacher-dashboard.html';
                    }, 1000);
                } else {
                    showToast(response.message, 'danger');
                }
            } catch (err) {
                showToast(err.message, 'danger');
            }
        }
    </script>
</body>

</html>
